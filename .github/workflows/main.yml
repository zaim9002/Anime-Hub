name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Active Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java version must be 17 or newer. Detected: $JAVA_MAJOR" >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare environment configuration
        run: |
          touch .env
          if [ -f ".env.example" ]; then
            cp -n .env.example .env 2>/dev/null || true
          fi
          echo "Environment configuration files prepared."

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Create temporary debug keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "./debug.keystore" ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          else
            echo "./debug.keystore already exists."
          fi

          if [ -f "./debug.keystore" ]; then
            echo "Confirmed: ./debug.keystore exists."
          else
            echo "Error: ./debug.keystore could not be created." >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Verify debug APK output
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Searching inside app/build/outputs/apk for generated debug APK..."
            DISCOVERED=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
            if [ -n "$DISCOVERED" ] && [ -f "$DISCOVERED" ]; then
              echo "Found APK at $DISCOVERED, copying to standard path $TARGET_APK..."
              mkdir -p app/build/outputs/apk/debug
              cp "$DISCOVERED" "$TARGET_APK"
            fi
          fi

          if [ -f "$TARGET_APK" ]; then
            echo "Target APK verified at: $TARGET_APK"
            ls -lh "$TARGET_APK"
          else
            echo "Error: Target APK missing at $TARGET_APK" >&2
            echo "Listing contents of app/build/outputs/apk:"
            find app/build/outputs/apk -type f 2>/dev/null || echo "No APK found."
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
